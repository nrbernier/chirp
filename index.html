<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chirp — navigate by sound</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chirp">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d1017">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Chirp</h1>
    <div id="levelName">—</div>
  </header>

  <div id="stage">
    <canvas id="canvas" width="520" height="520"></canvas>
    <div id="overlay">
      <button id="startBtn">▶ start</button>
      <p>headphones strongly recommended</p>
    </div>
  </div>

  <div id="lockwrap" title="lock progress"><div id="lockbar"></div></div>

  <div id="touchControls">
    <button class="tbtn" id="peekBtn">👁 peek</button>
    <button class="tbtn" id="restartBtn">↺ restart</button>
    <button class="tbtn" id="nextBtn">▶ next</button>
  </div>

  <p id="hint">…</p>
  <p id="status"></p>

  <footer>
    <span class="keysOnly"><kbd>←↑↓→</kbd> move</span>
    <span class="keysOnly"><kbd>H</kbd> peek</span>
    <span class="keysOnly"><kbd>R</kbd> restart</span>
    <span class="keysOnly"><kbd>N</kbd> next</span>
    <span class="touchOnly">drag the map to move</span>
    <label>vol <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></label>
  </footer>
</main>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
