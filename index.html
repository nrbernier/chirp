<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chirp — navigate by sound</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Chirp</h1>
    <div id="levelName">—</div>
  </header>

  <div id="stage">
    <canvas id="canvas" width="520" height="520"></canvas>
    <div id="overlay">
      <button id="startBtn">▶ start</button>
      <p>headphones strongly recommended</p>
    </div>
  </div>

  <div id="lockwrap" title="lock progress"><div id="lockbar"></div></div>

  <p id="hint">…</p>
  <p id="status"></p>

  <footer>
    <span><kbd>←↑↓→</kbd> move</span>
    <span><kbd>H</kbd> peek</span>
    <span><kbd>R</kbd> restart</span>
    <span><kbd>N</kbd> next</span>
    <label>vol <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></label>
  </footer>
</main>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
